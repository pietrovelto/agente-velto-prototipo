<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agente Velto">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Agente Velto · prototipo</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column. Fixed app shell = header + scrolling view + bottom tab bar.
   Chat and "Crea campagna" slide in from the right; the Agent rises from the bottom as a dark navy layer.
   Single light theme on purpose: it mirrors the Velto product UI. */
:root{
  --navy:#01205C; --navy-2:#0a3a8c; --navy-tint:#e8edf7;
  --cta:#F75C03; --cta-tint:#fff3ec; --cta-line:#fed7bf;
  --wa:#25D366; --wa-ink:#128c4b; --wa-bubble:#D9FDD3; --wa-wall:#EFEAE2; --wa-btn:#0b6aa2;
  --ai:#2CB3E8; --ai-ink:#0a7fb3; --ai-tint:#e3f5fd; --ai-line:#bfe9fb;
  --ok:#389854; --ok-tint:#e8f5ec;
  --warn:#FB7C00; --warn-ink:#b45309; --warn-tint:#fff4e5;
  --red:#C20000; --red-tint:#fde8e8;
  --ink:#09090B; --sub:#646a78; --faint:#a3a7b3;
  --ground:#F4F6FA; --card:#FFFFFF; --line:#E4E4E7; --soft:#EEF1F6;
  --desk:#020B24; --agent-1:#0b2a6b; --agent-2:#01205C; --agent-3:#020B24;
  --on-dark:#FFFFFF; --on-dark-2:rgba(255,255,255,.68); --on-dark-3:rgba(255,255,255,.12); --on-dark-4:rgba(255,255,255,.2);
  --shadow:0 10px 30px rgba(1,32,92,.14);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
b{font-weight:700}

#app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--ground);overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.view.enter{animation:viewIn .26s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}

/* header */
.top{background:var(--card);padding:calc(var(--safe-t) + 12px) 18px 12px;border-bottom:1px solid var(--line);flex:none}
.tt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.title{font-size:28px;font-weight:800;letter-spacing:-.025em;margin:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--navy-tint);display:grid;place-items:center;font-weight:700;color:var(--navy);font-size:13px;flex:none}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(112px + var(--safe-b));display:flex;flex-direction:column;gap:10px}
.small{font-size:13px;color:var(--sub)}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-top:6px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:#3f3f46;white-space:nowrap}
.chip.on{background:var(--navy);color:var(--on-dark)}
.chip.ok{background:var(--ok-tint);color:var(--ok)}
.chip.wait{background:var(--warn-tint);color:var(--warn-ink)}
.chip.ai{background:var(--ai-tint);color:var(--ai-ink)}
.chip.red{background:var(--red-tint);color:var(--red)}
.chip.wa{background:#e3f9ec;color:var(--wa-ink)}
.chip.info{background:var(--navy-tint);color:var(--navy)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -18px 0;padding:0 18px}
.chips::-webkit-scrollbar{display:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.btn{display:block;border-radius:14px;padding:12px 10px;text-align:center;font-weight:700;font-size:14px;flex:1}
.btn.cta{background:var(--cta);color:var(--on-dark);box-shadow:0 6px 16px rgba(247,92,3,.25)}
.btn.ghost{background:var(--soft);color:#3f3f46}
.btn.navy{background:var(--navy);color:var(--on-dark)}
.btn.line{border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn.danger{border:1.5px solid var(--red);color:var(--red);background:var(--card)}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:8px}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding:7px 4px calc(var(--safe-b) + 6px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--faint);width:72px;padding-top:2px;text-align:center}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--navy)}
.micbtn{width:62px;height:62px;border-radius:50%;margin-top:-24px;background:radial-gradient(circle at 35% 30%,#7fd6f7,var(--ai) 45%,var(--ai-ink));display:grid;place-items:center;box-shadow:0 8px 20px rgba(44,179,232,.45);border:4px solid var(--card);color:var(--on-dark);flex:none}
.micbtn svg{width:26px;height:26px}

/* calendario */
.weeknav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--sub);font-weight:600}
.weeknav button{width:32px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--navy)}
.weeknav button:disabled{opacity:.25}
.days{display:flex;justify-content:space-between;margin-top:6px;gap:2px}
.days button{flex:1;text-align:center;font-size:11px;color:var(--sub);font-weight:600;padding:6px 0;border-radius:12px;position:relative}
.days button b{display:block;font-size:16px;color:var(--ink);margin-top:2px}
.days button.on{background:var(--navy);color:#cbd5e1}
.days button.on b{color:var(--on-dark)}
.days button.today:not(.on) b{color:var(--cta)}
.days button i{position:absolute;left:50%;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--faint);transform:translateX(-50%)}
.days button.on i{background:var(--on-dark)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;text-align:center;font-size:13px;font-weight:600;padding:7px 0;border-radius:9px;color:#52525b}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline}
.dayhead b{font-size:15px}
.hint{background:var(--ai-tint);border:1px solid var(--ai-line);border-radius:16px;padding:11px 12px;font-size:14px;color:#075985}
.hint b{color:var(--ai-ink)}
.hint .row{margin-top:9px}
.hint .btn{padding:8px;font-size:13px}
.hint .btn.navy{background:var(--ai-ink)}
.appt{display:flex;gap:12px;align-items:stretch;width:100%}
.appt .h{width:46px;font-size:13px;font-weight:700;color:#3f3f46;padding-top:12px;flex:none;font-variant-numeric:tabular-nums}
.appt .card{flex:1;border-left:4px solid var(--navy);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.appt .card.st-wait{border-left-color:var(--warn)}
.appt .card.st-cancel{border-left-color:var(--line);opacity:.6}
.appt .card.st-cancel .n{text-decoration:line-through}
.appt .card.past{opacity:.55}
.appt .n{font-weight:700;font-size:15px}
.appt .chip{align-self:flex-start;margin-top:4px}
.appt .moved{font-size:12px;color:var(--warn-ink);font-weight:600}
.freebox{flex:1;border:1.5px dashed #cfd3dc;border-radius:16px;padding:12px;font-size:13px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.blockbox{flex:1;border-radius:16px;padding:12px;font-size:13px;color:var(--sub);font-weight:600;background:repeating-linear-gradient(-45deg,var(--soft),var(--soft) 6px,var(--card) 6px,var(--card) 12px);border:1px solid var(--line)}
.closed{padding:40px 10px;text-align:center;color:var(--sub)}
.wk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left}
.wk .d{width:46px;flex:none;font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;padding-top:2px}
.wk .d b{display:block;font-size:18px;color:var(--ink)}
.wk .card{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.wk .li{display:flex;gap:8px;font-size:13px}
.wk .li span:first-child{font-weight:700;width:40px;font-variant-numeric:tabular-nums;flex:none}
.wk.today .d b{color:var(--cta)}

/* conversazioni */
.conv{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid #eceef2;width:100%}
.p{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;background:var(--soft);color:#52525b}
.p.need{background:var(--red-tint);color:var(--red)}
.p.ai{background:var(--ai-tint);color:var(--ai-ink)}
.conv .m{flex:1;min-width:0}
.conv .m .nm{font-size:15px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.conv .m .nm span{font-size:12px;color:var(--sub);font-weight:500;flex:none}
.conv .m .pv{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv.unread .pv{color:var(--ink);font-weight:600}
.conv .tags{margin-top:5px;display:flex;gap:5px}
.empty{padding:30px 10px;text-align:center;color:var(--sub);font-size:14px}

/* chat */
.chathead{display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--navy);flex:none}
.back svg{width:22px;height:22px}
.chathead .who{flex:1;min-width:0}
.chathead .who b{display:block;font-size:16px}
.ctrl{font-size:12px;font-weight:700;padding:7px 10px;border-radius:10px;background:var(--navy);color:var(--on-dark);flex:none}
.ctrl.paused{background:var(--soft);color:var(--navy)}
.chatbody{flex:1;overflow-y:auto;background:var(--wa-wall);padding:14px 12px 16px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:82%;padding:8px 10px 6px;border-radius:12px;font-size:14.5px;line-height:1.38;background:var(--card);align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.msg.biz{align-self:flex-end;background:var(--wa-bubble)}
.msg .lab{display:block;font-size:11px;font-weight:700;color:var(--wa-ink);margin-bottom:2px}
.msg .lab.ai{color:var(--ai-ink)}
.msg .lab.ag{color:var(--navy)}
.msg time{display:block;text-align:right;font-size:10.5px;color:var(--sub);margin-top:2px}
.msg .tb{display:flex;flex-direction:column;gap:4px;margin:6px -4px -2px}
.msg .tb span{background:rgba(255,255,255,.75);border-radius:8px;padding:7px;text-align:center;font-size:13.5px;color:var(--wa-btn);font-weight:600}
.sys{align-self:center;background:rgba(255,255,255,.85);color:var(--sub);font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;text-align:center;max-width:90%}
.sys.need{background:var(--red-tint);color:var(--red)}
.compose{flex:none;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(var(--safe-b) + 8px)}
.compose .bar{display:flex;gap:8px;align-items:center}
.compose input{flex:1;min-width:0;border:1px solid var(--line);border-radius:20px;padding:10px 14px;background:var(--ground);font-size:16px}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--wa);color:var(--on-dark);flex:none}
.round.grey{background:var(--soft);color:var(--navy)}
.round svg{width:20px;height:20px}
.closedwin{font-size:13px;color:var(--warn-ink);background:var(--warn-tint);border-radius:12px;padding:9px 11px;margin-bottom:8px}
.tpls{display:flex;flex-direction:column;gap:6px}
.tpls button{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.tpls button span{color:var(--sub);font-weight:500;font-size:12px}
.free24{font-size:11.5px;color:var(--sub);margin-top:6px;text-align:center}

/* campagne */
.create{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:var(--on-dark);border:0;padding:16px;border-radius:20px}
.create h3{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em}
.create p{font-size:13px;opacity:.78;margin:4px 0 0}
.create .row{margin-top:12px}
.create .b1{background:var(--ai);color:var(--on-dark)}
.create .b2{background:var(--card);color:var(--navy)}
.camp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.camp b{font-size:15px}
.campcard{width:100%;text-align:left;display:flex;flex-direction:column;gap:4px}

/* wizard */
.steps{display:flex;gap:6px;margin-top:12px}
.steps div{flex:1;font-size:11px;font-weight:600;color:var(--sub)}
.steps div:before{content:"";display:block;height:4px;border-radius:2px;background:var(--line);margin-bottom:6px}
.steps .done:before{background:var(--ok)}
.steps .cur{color:var(--ink)}
.steps .cur:before{background:var(--navy)}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid #cfd3dc;flex:none;margin-top:1px}
.opt.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.opt.on .rd{border:6px solid var(--navy)}
.opt .tx{flex:1;min-width:0}
.opt .tx b{display:block}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--sub)}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card);font-size:16px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wizfoot{flex:none;padding:10px 16px calc(var(--safe-b) + 12px);background:var(--ground);border-top:1px solid var(--line)}
.wizfoot .btn{padding:15px 0;font-size:16px}
.err{color:var(--red);font-size:13px;font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35;padding:5px 0}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--on-dark);font-size:12px;font-weight:700;flex:none;background:var(--ok)}
.dot.w{background:var(--warn)}
.costbox{background:var(--cta-tint);border:1px solid var(--cta-line);border-radius:16px;padding:12px 14px}
.costbox .k{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.costbox .v{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* whatsapp preview */
.wap{background:var(--wa-wall);border-radius:14px;padding:10px}
.wap .msg{max-width:100%;align-self:stretch}
.var{background:rgba(44,179,232,.18);border-radius:4px;padding:0 2px}

/* statistiche */
.picker{margin-top:10px;position:relative}
.picker select{appearance:none;-webkit-appearance:none;width:100%;border:0;background:var(--soft);border-radius:12px;padding:10px 34px 10px 12px;font-size:15px;font-weight:600}
.picker:after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--sub);font-weight:600}
.bar{height:28px;border-radius:8px;background:var(--ai-tint);position:relative;font-size:12.5px;font-weight:600;display:flex;align-items:center;padding:0 10px;justify-content:space-between;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,var(--ai),#7fd6f7)}
.bar span{position:relative;font-variant-numeric:tabular-nums}
.bar.g{background:var(--ok-tint)}
.bar.g i{background:var(--ok)}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.kv b{font-variant-numeric:tabular-nums}
.qa{display:flex;flex-direction:column;gap:6px}
.qa button{text-align:left}

/* sheet + scrim */
#scrim{position:absolute;inset:0;background:rgba(2,11,36,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(var(--safe-b) + 18px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
#sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px;flex:none}
.sheet-h{font-size:20px;font-weight:800;letter-spacing:-.015em}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--soft);font-size:12.5px;font-weight:600;color:var(--navy)}
.act svg{width:22px;height:22px}
.act.wa{color:var(--wa-ink)}
.act.red{color:var(--red)}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.sel{user-select:all;-webkit-user-select:all;font-weight:700;font-variant-numeric:tabular-nums}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eceef2;font-size:14px;gap:10px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--ok)}
.sw.on:after{transform:translateX(18px)}
.ver{text-align:center;font-size:12px;color:var(--faint);padding:8px 0}

/* push layer */
#push{position:absolute;inset:0;z-index:40;background:var(--ground);transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;visibility:hidden}
#push.open{transform:none;visibility:visible}

/* agente */
#agent{position:absolute;inset:0;z-index:50;background:linear-gradient(170deg,var(--agent-1),var(--agent-2) 55%,var(--agent-3));color:var(--on-dark);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility .38s;display:flex;flex-direction:column;visibility:hidden}
#agent.open{transform:none;visibility:visible}
.ahead{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-t) + 10px) 16px 6px;flex:none}
.ahead .t{font-size:14px;color:var(--on-dark-2)}
.ahead .t b{color:var(--on-dark);font-weight:700}
.x{width:36px;height:36px;border-radius:50%;background:var(--on-dark-3);display:grid;place-items:center;color:var(--on-dark)}
.x svg{width:18px;height:18px}

/* ---------- calendario: logica ---------- */
function dayItems(d){return S.appts.filter(function(a){return a.date===d}).sort(function(a,b){return toMin(a.time)-toMin(b.time)})}
function busy(d,ex){return dayItems(d).filter(function(a){return a.status!=='cancel'&&a.id!==ex})}
function freeSlots(d){var h=hoursOf(d);if(!h)return[];var cur=h[0],out=[];busy(d).forEach(function(a){var s=toMin(a.time);if(s-cur>=30)out.push([cur,s]);cur=Math.max(cur,s+a.dur)});if(h[1]-cur>=30)out.push([cur,h[1]]);return out}
function isFree(d,start,dur,ex){var h=hoursOf(d);if(!h||start<h[0]||start+dur>h[1])return false;return !busy(d,ex).some(function(a){var s=toMin(a.time);return start<s+a.dur&&s<start+dur})}
function nearestFree(d,start,dur,ex){var h=hoursOf(d);if(!h)return null;var best=null;for(var m=h[0];m+dur<=h[1];m+=15){if(isFree(d,m,dur,ex)&&(best===null||Math.abs(m-start)<Math.abs(best-start)))best=m}return best}
function apptById(id){for(var i=0;i<S.appts.length;i++)if(S.appts[i].id===id)return S.appts[i];return null}
function people(){var s={};S.appts.forEach(function(a){if(a.type!=='block')s[a.name]=1});S.convs.forEach(function(c){s[c.name]=1});return Object.keys(s)}
function findPerson(t){
  var ps=people(),hit=null;
  ps.forEach(function(n){if(hit)return;var parts=norm(n).replace(/\./g,'').split(' ');
    if(new RegExp('\\b'+parts[0]+'\\b').test(t))hit=n;else if(parts[1]&&parts[1].length>2&&new RegExp('\\b'+parts[1]+'\\b').test(t))hit=n});
  return hit;
}
function parseDay(t){
  if(/dopodomani/.test(t))return addDays(TODAY,2);
  if(/domani/.test(t))return addDays(TODAY,1);
  if(/\boggi\b/.test(t))return TODAY;
  var map={lunedi:1,martedi:2,mercoledi:3,giovedi:4,venerdi:5,sabato:6,domenica:0};
  for(var k in map){if(t.indexOf(k)>=0){for(var i=1;i<=7;i++){var d=addDays(TODAY,i);if(dow(d)===map[k])return d}}}
  var m=t.match(/\b(\d{1,2}) (ottobre|ott)\b/);if(m)return '2026-10-'+String(m[1]).padStart(2,'0');
  return null;
}
function parseTime(t){var m=t.match(/\b(?:alle|ore|per le|dalle)\s+(\d{1,2})(?:[:.](\d{2}))?/);if(!m)return null;var h=+m[1];if(h<8)h+=12;return h*60+(m[2]?+m[2]:0)}
function unconfirmed(){return S.appts.filter(function(a){return a.status==='wait'&&!a.reminded&&!a.moved&&a.date>=TODAY})}

function convById(id){for(var i=0;i<S.convs.length;i++)if(S.convs[i].id===id)return S.convs[i];return null}
function convByName(n){for(var i=0;i<S.convs.length;i++)if(S.convs[i].name===n)return S.convs[i];return null}
function ensureConv(n){var c=convByName(n);if(!c){c={id:'c'+Date.now()+Math.floor(Math.random()*99),name:n,time:'',window:'closed',msgs:[]};S.convs.push(c)}return c}
function addMsg(n,m){var c=ensureConv(n);m.t=m.t||('oggi '+now());c.msgs.push(m);c.time=now();if(m.f==='c')c.unread=true;return c}
function lastText(c){for(var i=c.msgs.length-1;i>=0;i--)if(c.msgs[i].f!=='sys')return c.msgs[i].x;return ''}

function createCampaign(o){
  var l=listById(o.list);
  var c={id:'c'+Date.now(),name:o.name,list:o.list,contacts:recips(l),body:o.body,btns:['Prenota ora','Info','Disiscriviti'],by:who()};
  S.camps.unshift(c);
  if(o.needsMeta){c.status='review';c.approveAt=Date.now()+6500;c.whenPref=o.when;log('Inviato a Meta il template “'+c.name+'”');scheduleApproval(c)}
  else if(S.role!=='owner'){c.status='approval';c.when=whenLabel(o.when);log('Chiesta a Giulia l\'approvazione di “'+c.name+'”')}

function launch(c,w){
  if(w==='now'){c.status='sending';c.when='oggi '+now();log('Inviata “'+c.name+'” a '+num(c.contacts)+' contatti');
    setTimeout(function(){c.status='sent';c.stats=fakeStats(c.contacts);save();render()},4000)}
  else{c.status='scheduled';c.when=whenLabel(w);log('Programmata “'+c.name+'” · '+c.when.toLowerCase())}
}
function scheduleApproval(c){
  var ms=Math.max(400,(c.approveAt||0)-Date.now());
  setTimeout(function(){
    if(c.status!=='review')return;
    if(S.role!=='owner'){c.status='approval';save();render();notify({title:'Template approvato da Meta',text:'“'+c.name+'” è pronto. L\'ho mandato a Giulia per l\'approvazione.'});return}
    c.status='ready';save();render();
    notify({title:'Template approvato ✓',text:'“'+c.name+'” è pronto. Invio ora o sabato alle 10?',actions:[
      {l:'Invia ora',cls:'cta',fn:function(){sendConfirm(c,'now')}},
      {l:'Sabato 10:00',cls:'line',fn:function(){sendConfirm(c,'sat')}}]});
  },ms);
}

/* ---------- agente: comandi e domande ---------- */
function route(raw,t){
  if(UI.pending&&UI.pending.type==='promo'&&!/^(annulla|lascia stare|niente)/.test(t)){var p=UI.pending;UI.pending=null;return promoFlow(raw,t,p.data)}
  UI.pending=null;
  if(/\b(sposta|spostare|spostalo|spostala)\b/.test(t))return moveFlow(t);
  if(/\bblocca\b/.test(t))return blockFlow(t);
  if(/\brispondi\b/.test(t))return replyFlow(raw,t);
  if(/\b(reinvia|rimandala|rimanda|rimandarla|rinvia)\b/.test(t)&&/lett|letto|letta/.test(t))return resendFlow(t);
  if(/(cosa|che) ha (risposto|fatto)|ha risposto/.test(t))return answeredFlow(t);
  if(/\binfo\b/.test(t))return infoFlow(t);
  if(/promemoria|(non (ha|hanno) confermato)|chi non ha confermato/.test(t))return remindFlow();
  if(/disiscri/.test(t))return unsubFlow();
  if(/(quale|che) (promo|campagna)|classifica|piu prenotazioni|migliore/.test(t))return rankFlow();
  if(/(com'?e|come e|come sta|come|com) ?(andata|andato|va)|risultat|statistich|numeri/.test(t)&&!/\b(crea|prepara)\b/.test(t))return statsFlow(t);
  if(/approva|black friday/.test(t))return approveFlow();
  if(/(3|tre) mesi|non (viene|vengono) da/.test(t))return dormantFlow();
  if(/\b(promo|promozione|campagna|offerta)\b/.test(t))return promoFlow(raw,t,null);
  if(/riempi|buco|posto libero|slot/.test(t))return fillFlow(t);
  if(/chi ho|chi c'?e|chi viene|appuntament|agenda|cosa ho/.test(t))return whoFlow(t);
  if(/^(ciao|buongiorno|buonasera|aiuto|help|cosa (sai|puoi)|che cosa sai)/.test(t))return helpFlow(true);
  return helpFlow(false);
}
function helpFlow(greet){
  say(greet?'Ciao '+who()+'! Posso spostare appuntamenti, preparare promo e rispondere a domande su campagne e contatti. Prima di fare qualsiasi cosa ti chiedo conferma.':'Non sono sicuro di aver capito. In questa demo so fare queste cose, prova una di queste:');
  addEl(picks(['Sposta Mario a lunedì','Chi ho domani?','Crea una promo per Clienti fedeli: colore + piega a €49, solo a ottobre, prenotazioni entro il 24','Com\'è andata la promo di settembre?','Cosa ha risposto Mario alla campagna di settembre?']),'say');
}

function moveFlow(t){
  var name=findPerson(t);
  if(!name)return say('Chi devo spostare? Dimmi il nome, per esempio “sposta Mario a lunedì”.');
  var a=nextAppt(name);
  if(!a)return say('Non trovo appuntamenti in programma per '+esc(name)+'.');
  var day=parseDay(t.replace(/\b(oggi|domani)\b.*\b(a|al|per)\b/,''));
  if(!day||day===a.date&&!parseTime(t)){say('A che giorno sposto '+esc(first(name))+'? Ora è '+fLong(a.date)+' alle '+a.time+'.');return addEl(picks(['lunedì','martedì','mercoledì'].map(function(d){return {l:cap(d),t:'Sposta '+first(name)+' a '+d}})),'say')}
  if(!hoursOf(day)){say('Domenica il salone è chiuso. Scegli un altro giorno:');return addEl(picks([{l:'Lunedì',t:'Sposta '+first(name)+' a lunedì'},{l:'Martedì',t:'Sposta '+first(name)+' a martedì'}]),'say')}
  var want=parseTime(t)||toMin(a.time), start=want, note='';
  if(!isFree(day,want,a.dur,a.id)){start=nearestFree(day,want,a.dur,a.id);if(start===null){return say(cap(fLong(day))+' è pieno. Vuoi provare un altro giorno?')}note='<div class="chk"><span class="dot w">!</span><span>Alle '+toT(want)+' è occupato: ti propongo le <b>'+toT(start)+'</b>, l\'orario libero più vicino.</span></div>'}
  var msg='Ciao '+first(name)+', il tuo appuntamento da Salone Giulia è stato spostato a '+fLong(day)+' alle '+toT(start)+'. Ti va bene?';
  actionCard({eyebrow:'✦ Sposta appuntamento',
    html:'<div><b>'+esc(name)+'</b> · '+esc(a.service)+' · '+a.dur+' min</div><div class="tl"><span class="k">Da</span><span>'+cap(fLong(a.date))+', '+a.time+'</span></div><div class="tl"><span class="k">A</span><span><b>'+cap(fLong(day))+', '+toT(start)+'</b></span></div>'+
      (note||'<div class="chk"><span class="dot">✓</span><span>'+cap(fShort(day))+' alle '+toT(start)+' è libero</span></div>')+
      '<div class="chk"><span class="dot">✓</span><span>Aggiorno anche Google Calendar</span></div><div class="small">Avviso '+esc(first(name))+' su WhatsApp con questo messaggio:</div>'+waPreview(msg.replace(first(name),'{{nome}}'),['Confermo','Scegli un altro orario'],first(name)),
    cost:'Template utility · <b>'+rate(UTL)+'</b> · sul tuo account Meta',
    run:function(){if(a.status==='cancel')return 'Appuntamento già disdetto';a.moved={date:a.date,time:a.time};a.date=day;a.time=toT(start);a.status='wait';
      var c=addMsg(name,{f:'biz',ag:who(),x:msg,b:['Confermo','Scegli un altro orario']});c.agent='spostamento';
      log('Spostato '+short(name)+' a '+fShort(day)+', '+toT(start));UI.day=day;UI.calMode='day';
      return {t:'Spostato · '+first(name)+' riceve il messaggio su WhatsApp',go:'cal:'+day,gl:'Vedi nel calendario →'}}});
}

function whoFlow(t){
  var d=parseDay(t)||TODAY;
  if(!hoursOf(d))return say(cap(fLong(d))+' il salone è chiuso.');
  var its=dayItems(d).filter(function(a){return a.type!=='block'&&a.status!=='cancel'});
  var fr=freeSlots(d);
  var h='<div class="eyebrow">✦ '+cap(fLong(d))+' · '+its.length+' '+plural(its.length,'appuntamento','appuntamenti')+'</div>';
  its.forEach(function(a){h+='<div class="tl"><span class="k">'+a.time+'</span><span><b>'+esc(a.name)+'</b> · '+esc(a.service)+' '+(a.status==='ok'?'<span class="chip ok">✓</span>':'<span class="chip wait">in attesa</span>')+'</span></div>'});
  if(fr.length)h+='<div class="small">Liberi: '+fr.map(function(f){return toT(f[0])+'–'+toT(f[1])}).join(', ')+'</div>';
  var w=its.filter(function(a){return a.status==='wait'});
  if(w.length)h+='<div class="small">'+w.length+' '+plural(w.length,'non ha','non hanno')+' ancora confermato.</div>';
  h+='<button class="link" data-a="goto" data-v="cal:'+d+'">Apri il calendario →</button>';
  card(h);
}

function remindFlow(){
  var l=unconfirmed();

/* --- promo: dalla frase alla bozza --- */
function matchList(t){if(/fedel/.test(t))return 'fedeli';if(/colore/.test(t)&&/clienti colore|lista colore/.test(t))return 'colore';if(/tutti/.test(t))return 'tutti';if(/(3|tre) mesi|non vengono/.test(t))return 'dormienti';return null}
function parsePrice(raw){var m=raw.match(/(?:€\s*(\d+(?:[.,]\d{1,2})?))|(?:(\d+(?:[.,]\d{1,2})?)\s*(?:€|euro))/i);if(!m)return null;return '€'+(m[1]||m[2]).replace('.',',')}
function parseService(raw,t){
  var src=raw.indexOf(':')>=0?raw.split(':').slice(1).join(':'):raw;
  src=src.replace(/crea (una )?(promo|promozione|campagna)( per)?/i,'').replace(/clienti fedeli|tutti i clienti|clienti colore|non vengono da (3|tre) mesi/ig,'').replace(/^\s*(per|alla lista|lista)\s+/i,'');
  var s=src.split(/,|\s+a\s+soli|\s+a\s+€|\s+a\s+\d|€|\d+\s*euro|\bsolo\b|\bentro\b|\bper tutto\b/i)[0].trim().replace(/^(con|un|una|il|la)\s+/i,'');
  if(!s||/^\d/.test(s)||s.length<3)return null;return s;
}
function promoBody(d){
  var month=d.month?' per tutto '+d.month:'';
  var s=d.short?'Ciao {{nome}}! '+cap(d.service)+' a '+d.price+month+'.':'Ciao {{nome}}!'+(d.month?' Per tutto '+d.month+':':'')+' '+d.service+' a soli '+d.price+'.';
  if(d.deadline)s+=' Prenota entro il '+d.deadline+'.';
  if(!d.noEmoji)s+=' 👇';
  return s;
}
function promoFlow(raw,t,partial){
  var d=partial||{};
  var L=matchList(t);if(L)d.list=L;
  var pr=parsePrice(raw);if(pr)d.price=pr;
  var dl=t.match(/entro (?:il |l')?(\d{1,2})/);if(dl)d.deadline=dl[1];
  var mo=t.match(/\b(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\b/);if(mo)d.month=mo[1];
  if(!d.service){var sv=parseService(raw,t);if(sv&&!(L&&norm(sv).length<4))d.service=sv}
  if(!d.list){UI.pending={type:'promo',data:d};say('A quale lista la mando?');return addEl(picks(LISTS.map(function(l){return {l:l.name+' · '+num(l.total),t:l.name}})),'say')}
  if(!d.service){UI.pending={type:'promo',data:d};return say('Cosa promuoviamo per “'+esc(listById(d.list).name)+'”? Dimmi servizio e prezzo, per esempio “colore + piega a €49”.')}
  if(!d.price){UI.pending={type:'promo',data:d};return say('Che prezzo metto per '+esc(d.service)+'? Prezzi, date e condizioni li prendo solo da te: non li invento.')}
  d.name=cap(d.service)+' '+d.price;
  var el=card('');
  function draw(){
    el.innerHTML='<div class="eyebrow">✦ Bozza template · marketing</div><div class="small">Per <b>'+esc(listById(d.list).name)+'</b> · '+num(recips(listById(d.list)))+' contatti con consenso</div>'+waPreview(promoBody(d),['Prenota ora','Info','Disiscriviti'])+
      '<div class="small">Nessun template approvato si adatta cambiando solo le variabili: questo va approvato da Meta.</div>'+
      (d.locked?'':'<div class="pick"><button data-p="short">'+(d.short?'Versione lunga':'Più corto')+'</button><button data-p="emoji">'+(d.noEmoji?'Rimetti l\'emoji':'Togli l\'emoji')+'</button></div><div class="row"><button class="btn ghost" data-p="no">Annulla</button><button class="btn navy" data-p="go">Avanti: controlli</button></div>');
    var b=function(k,f){var x=el.querySelector('[data-p='+k+']');if(x)x.onclick=f};
    b('short',function(){d.short=!d.short;draw()});b('emoji',function(){d.noEmoji=!d.noEmoji;draw()});
    b('no',function(){d.locked=1;draw();el.insertAdjacentHTML('beforeend','<div class="undone">Annullato. Non ho creato niente.</div>')});
    b('go',function(){d.locked=1;draw();controls()});
  }
  function controls(){
    var l=listById(d.list),n=recips(l);
    actionCard({eyebrow:'✦ Controlli prima dell\'invio',html:'<div>'+checksHTML(d.list,true)+'</div>'+costBox(n),
      yes:S.role==='owner'?'Conferma: invia a Meta':'Invia a Meta e chiedi a Giulia',
      run:function(){var c=createCampaign({name:d.name,list:d.list,body:promoBody(d),needsMeta:true});
        say('Inviato a Meta per l\'approvazione. Ti avviso con una notifica appena risponde, di solito in pochi minuti.');
        return {t:'Template “'+c.name+'” inviato a Meta',go:'camp',gl:'Vedi in Campagne →'}}});
  }
  draw();
}

function newWiz(pre){return Object.assign({step:1,list:null,mode:'reuse',per:'',srv:'',prc:'',dl:'',ai:'',aiBody:'',when:'sat',name:'',err:''},pre||{})}
function wizBody(w){
  if(w.mode==='reuse'){if(!w.srv||!w.prc)return null;return 'Ciao {{nome}}! Per '+(w.per||'…')+': '+w.srv+' a soli '+(/€/.test(w.prc)?w.prc:'€'+w.prc)+'. Prenota entro il '+(w.dl||'…')+' 👇'}
  return w.aiBody||null;
}
function renderWiz(){
  var w=UI.wiz,st=['A chi','Messaggio','Controlli','Quando'];
  var h='<header class="top"><div class="tt"><button class="back" data-a="wback" style="width:auto;gap:4px;display:flex;align-items:center;font-weight:700;font-size:17px">'+I.back+' Nuova campagna</button><span class="small">'+w.step+' di 4</span></div><div class="steps">'+st.map(function(s,i){return '<div class="'+(i+1<w.step?'done':i+1===w.step?'cur':'')+'">'+s+'</div>'}).join('')+'</div></header><div class="scroll" style="padding-bottom:24px">';
  if(w.step===1){
    h+='<div class="sec">Scegli la lista</div>';
    LISTS.forEach(function(l){h+='<button class="card opt'+(w.list===l.id?' on':'')+'" data-a="wlist" data-v="'+l.id+'"><span class="rd"></span><span class="tx"><b>'+esc(l.name)+'</b><span class="small">'+num(l.total)+' contatti · '+num(recips(l))+' con consenso marketing</span></span></button>'});
    S.lists.forEach(function(l){h+='<div class="card opt" style="opacity:.6"><span class="rd"></span><span class="tx"><b>'+esc(l.name)+'</b><span class="small">'+num(l.n)+' contatti · creata dall\'agente</span></span></div>'});
    h+='<div class="small">Velto esclude in automatico chi si è disiscritto e chi non ha il consenso marketing.</div>';
  }
  if(w.step===2){
    h+='<button class="card opt'+(w.mode==='reuse'?' on':'')+'" data-a="wmode" data-v="reuse"><span class="rd"></span><span class="tx"><b>Riusa un template approvato</b><span class="small">“Promo con variabili”: cambi solo i campi, nessuna attesa Meta</span></span></button>';
    h+='<button class="card opt'+(w.mode==='ai'?' on':'')+'" data-a="wmode" data-v="ai"><span class="rd"></span><span class="tx"><b>Crea un messaggio nuovo con l\'AI</b><span class="small">Va approvato da Meta, di solito in pochi minuti</span></span></button>';
    if(w.mode==='reuse')h+='<div class="grid2"><div class="field"><label for="wper">Periodo</label><input id="wper" data-w="per" value="'+esc(w.per)+'" placeholder="tutto ottobre"></div><div class="field"><label for="wprc">Prezzo</label><input id="wprc" data-w="prc" inputmode="decimal" value="'+esc(w.prc)+'" placeholder="€49"></div></div><div class="field"><label for="wsrv">Servizio</label><input id="wsrv" data-w="srv" value="'+esc(w.srv)+'" placeholder="colore + piega"></div><div class="field"><label for="wdl">Prenota entro il</label><input id="wdl" data-w="dl" inputmode="numeric" value="'+esc(w.dl)+'" placeholder="24"></div>';
    else h+='<div class="field"><label for="wai">Descrivi la promo con le tue parole</label><textarea id="wai" data-w="ai" placeholder="Per esempio: cheratina a 70 euro fino al 31 ottobre">'+esc(w.ai)+'</textarea></div><button class="btn line" data-a="wgen">✦ Prepara il messaggio</button>';
    var b=wizBody(w);
    h+='<div class="sec">Anteprima WhatsApp</div><div id="wprev">'+(b?waPreview(b,['Prenota ora','Info','Disiscriviti']):'<div class="card small">Compila i campi per vedere l\'anteprima.</div>')+'</div>';
  }
  if(w.step===3){
    var l=listById(w.list);
    h+='<div class="card">'+checksHTML(w.list,w.mode==='ai')+'</div>'+costBox(recips(l));
  }
  if(w.step===4){
    var needs=w.mode==='ai';
    h+='<div class="field"><label for="wname">Nome della campagna</label><input id="wname" data-w="name" value="'+esc(w.name)+'"></div>';
    if(needs)h+='<div class="card hint" style="border-radius:16px">Prima serve l\'approvazione di Meta. Ti avviso con una notifica quando arriva e scegli lì se inviarla subito o sabato alle 10.</div>';
    else{h+='<div class="sec">Quando</div>';[['now','Subito','Parte appena confermi'],['sat','Sabato 10 ottobre, 10:00','Una settimana dopo “Ottobre €35”'],['mon','Lunedì 12 ottobre, 09:00','']].forEach(function(o){h+='<button class="card opt'+(w.when===o[0]?' on':'')+'" data-a="wwhen" data-v="'+o[0]+'"><span class="rd"></span><span class="tx"><b>'+o[1]+'</b>'+(o[2]?'<span class="small">'+o[2]+'</span>':'')+'</span></button>'})}
    if(S.role!=='owner')h+='<div class="small">Sei collaboratore: la campagna parte solo dopo l\'approvazione di Giulia.</div>';
  }
  if(w.err)h+='<div class="err">'+esc(w.err)+'</div>';
  h+='</div><div class="wizfoot">';
  var lab=w.step===1?'Avanti: messaggio':w.step===2?'Avanti: controlli':w.step===3?'Avanti: quando inviarla':(S.role!=='owner'?'Richiedi approvazione al titolare':w.mode==='ai'?'Invia a Meta per l\'approvazione':w.when==='now'?'Conferma e invia · ≈ '+eur(recips(listById(w.list))*MKT):'Conferma e programma');
  h+='<button class="btn cta" data-a="wnext">'+lab+(w.step<4?' →':'')+'</button></div>';
  return h;
}
function wizNext(){
  var w=UI.wiz;w.err='';
  if(w.step===1&&!w.list)w.err='Scegli una lista per continuare.';
  if(w.step===2){
    if(w.mode==='reuse'){if(!w.srv||!w.prc||!w.per||!w.dl)w.err='Compila tutti i campi. Prezzo e date li decidi tu: l\'AI non li inventa.'}
    else if(!w.aiBody)w.err='Descrivi la promo e tocca “Prepara il messaggio”.';
    if(!w.err&&!w.name)w.name=w.mode==='reuse'?cap(w.srv)+' '+(/€/.test(w.prc)?w.prc:'€'+w.prc):'Nuova promo '+fShort(TODAY);
  }
  if(w.err){renderPush();return}
  if(w.step<4){w.step++;renderPush();$('#push .scroll').scrollTop=0;return}
  if(w.editing)S.camps=S.camps.filter(function(x){return x.id!==w.editing});
  var c=createCampaign({name:w.name||'Nuova campagna',list:w.list,body:wizBody(w),needsMeta:w.mode==='ai',when:w.when});
  closePush();UI.tab='camp';render(true);
  toast(c.status==='review'?'Inviata a Meta. Ti avviso quando è approvata.':c.status==='approval'?'Richiesta inviata a Giulia':c.status==='sending'?'Invio partito':'Campagna programmata');
}

/* ---------- azioni ---------- */
var A={
  tab:function(v){if(UI.tab===v&&!$('#push').classList.contains('open'))return;go(v)},
  agent:function(){openAgent()},
  agentClose:closeAgent,
  day:function(v){UI.day=v;render()},
  dayview:function(v){UI.day=v;UI.calMode='day';render(true)},
  week:function(v){UI.day=addDays(UI.day,7*+v);var wk=Math.floor((D(UI.day)-D(WEEK0))/(7*864e5));if(wk<0)UI.day=WEEK0;if(wk>1)UI.day=addDays(WEEK0,13);render()},
  calmode:function(v){UI.calMode=v;render(true)},
  hintYes:function(){openAgent();submit('Manda un promemoria a chi non ha confermato')},
  hintNo:function(){S.hintOff=true;save();render()},
  appt:function(v){var a=apptById(v);if(a)apptSheet(a)},
  free:function(v){var p=v.split('|'),d=p[0],s=+p[1],e=+p[2];
    openSheet('<div><div class="sheet-h">Libero · '+toT(s)+'–'+toT(e)+'</div><div class="small">'+cap(fLong(d))+'</div></div>'+
      '<div class="field"><label for="nfn">Cliente</label><select id="nfn">'+people().filter(function(n){return n!=='Bloccato'}).sort().map(function(n){return '<option>'+esc(n)+'</option>'}).join('')+'</select></div>'+
      '<div class="field"><label for="nfs">Servizio</label><select id="nfs"><option value="Piega|30">Piega · 30 min</option><option value="Taglio|45">Taglio · 45 min</option><option value="Colore|90">Colore · 90 min</option><option value="Trattamento|30">Trattamento · 30 min</option></select></div>'+
      '<div class="row"><button class="btn line" data-a="fillAsk" data-v="'+toT(s)+'">✦ Chiedi all\'agente</button><button class="btn cta" data-a="sconfirm">Crea appuntamento</button></div>',
      function(){var n=$('#nfn').value,sv=$('#nfs').value.split('|');var dur=+sv[1];if(!isFree(d,s,dur)){toast('Non c\'è abbastanza tempo libero');return}
        S.appts.push({id:'a'+Date.now(),date:d,time:toT(s),dur:dur,name:n,service:sv[0],status:'wait'});save();closeSheet();render();toast('Appuntamento creato · '+first(n)+' riceve la richiesta di conferma')})},
  fillAsk:function(v){closeSheet();openAgent();submit('Riempi il buco delle '+v)},
  sconfirm:function(){if(UI.sheetFn)UI.sheetFn()},
  closeSheet:closeSheet,
  amove:function(v){var a=apptById(v);closeSheet();openAgent('Sposta '+first(a.name)+' a ')},
  acancel:function(v){var a=apptById(v);
    $('#sx').innerHTML='<div class="card" style="display:flex;flex-direction:column;gap:8px"><div>Disdico e avviso <b>'+esc(first(a.name))+'</b> su WhatsApp con un link per riprenotare?</div><div class="cost">Template utility · <b>'+rate(UTL)+'</b></div><div class="row"><button class="btn ghost" data-a="closeSheet">Annulla</button><button class="btn cta" data-a="sconfirm">Conferma disdetta</button></div></div>';
    UI.sheetFn=function(){a.status='cancel';a.why='Disdetto da te · avvisato';addMsg(a.name,{f:'biz',lab:who(),x:'Ciao '+first(a.name)+', il tuo appuntamento di '+fLong(a.date)+' alle '+a.time+' è stato annullato. Scegli un nuovo orario qui 👇',b:['Scegli un orario']});log('Disdetto '+short(a.name)+' · '+fShort(a.date)+' '+a.time);save();closeSheet();render();toast('Disdetto · '+first(a.name)+' è stato avvisato')}},
  awrite:function(v){var a=apptById(v);var c=ensureConv(a.name);save();closeSheet();UI.tab='conv';render(true);openChat(c.id)},
  acall:function(v){var a=apptById(v);$('#sx').innerHTML='<div class="note">Numero di '+esc(first(a.name))+': <span class="sel">'+phoneOf(a.name)+'</span><div class="small">Numero finto della demo.</div></div>'},
  anote:function(v){var a=apptById(v);$('#sx').innerHTML='<div class="note">'+esc(a.note||'Nessuna nota per questo cliente.')+'</div>'},
  cf:function(v){UI.cf=v;render()},
  conv:function(v){openChat(v)},
  back:closePush,
  takeover:function(){var c=convById(UI.chat);c.paused=!c.paused;if(c.paused)c.need=null;save();render();toast(c.paused?'AI in pausa: ora rispondi tu':'AI riattivata')},
  voicenote:function(){toast('I vocali arriveranno nell\'app vera. Qui scrivi il messaggio.')},
  tpl:function(v){var c=convById(UI.chat),T=TPL[v],x=T.x(c.name);
    openSheet('<div class="sheet-h">'+esc(T.n)+'</div>'+'<div class="wap"><div class="msg biz">'+esc(x)+'<div class="tb">'+T.b.map(function(b){return '<span>'+esc(b)+'</span>'}).join('')+'</div><time>ora</time></div></div><div class="cost">Template '+T.k+' · <b>'+rate(T.r)+'</b> · sul tuo account Meta</div><div class="row"><button class="btn ghost" data-a="closeSheet">Annulla</button><button class="btn cta" data-a="sconfirm">Conferma e invia</button></div>',
      function(){addMsg(c.name,{f:'biz',lab:who(),x:x,b:T.b});save();closeSheet();renderPush(true);render();toast('Inviato a '+first(c.name))})},
  dilla:function(){openAgent('Crea una promo per ')},
  compose:function(){UI.chat=null;UI.wiz=newWiz();openPush()},
  editcamp:function(v){var c=campById(v);UI.chat=null;UI.wiz=newWiz({step:2,list:c.list,mode:'ai',aiBody:c.body,ai:'',name:c.name,editing:c.id});openPush();toast('Modifichi la bozza di Luca')},
  approve:function(){openAgent();submit('Approva Black Friday anticipato')},
  camp:function(v){var c=campById(v),l=listById(c.list);
    var h='<div><div class="sheet-h">'+esc(c.name)+'</div><div class="small">'+esc(l.name)+' · '+num(c.contacts)+' contatti'+(c.when?' · '+esc(c.when):'')+'</div></div><div>'+statusChip(c)+'</div>'+waPreview(c.body,c.btns)+'<div class="cost">Costo Meta '+(c.status==='sent'?'':'stimato ')+'<b>'+eur(campCost(c))+'</b> · '+num(c.contacts)+' × '+rate(MKT)+'</div>';
    if(c.status==='sent')h+='<button class="btn navy" data-a="goto" data-v="stats:'+c.id+'">Vedi statistiche</button>';
    if(c.status==='ready'&&S.role==='owner')h+='<div class="row"><button class="btn line" data-a="sendc" data-v="'+c.id+'|sat">Sabato 10:00</button><button class="btn cta" data-a="sendc" data-v="'+c.id+'|now">Invia ora</button></div>';
    if(c.status==='review')h+='<div class="small">Meta sta verificando il template. Ti avviso con una notifica.</div>';
    if(c.status==='scheduled')h+='<button class="btn danger" data-a="unsched" data-v="'+c.id+'">Annulla programmazione</button>';
    openSheet(h)},
  sendc:function(v){var p=v.split('|');closeSheet();sendConfirm(campById(p[0]),p[1])},
  unsched:function(v){var c=campById(v);openSheet('<div class="sheet-h">Annullo “'+esc(c.name)+'”?</div><div class="small">Non parte nessun messaggio. Resta tra le bozze.</div><div class="row"><button class="btn ghost" data-a="closeSheet">No</button><button class="btn cta" data-a="sconfirm">Sì, annulla</button></div>',function(){c.status='draft';c.when='';log('Annullata la programmazione di “'+c.name+'”');save();closeSheet();render();toast('Programmazione annullata')})},
  qa:function(v){var c=campById(UI.stats),s=c.stats;openAgent();
    if(v==='info')submit('Crea una lista da chi ha cliccato Info');
    else if(v==='unread')submit('Rimandala a chi non l\'ha letta');
    else{userBubble('Crea una lista dai non consegnati');listAction('Non consegnati · '+c.name,s.sent-s.deliv)}},
  profile:function(){UI.vtaps=0;openSheet(profileHTML())},
  role:function(v){S.role=v;save();$('#sheet').innerHTML='<div class="grab"></div>'+profileHTML();render();toast(v==='owner'?'Ora sei Giulia, titolare':'Ora sei Luca, collaboratore')},
  sw:function(v,el){el.classList.toggle('on')},
  vtap:function(){UI.vtaps++;if(UI.vtaps>=3){var r=$('#resetbox');if(r)r.hidden=false}},
  reset:function(){openSheet('<div class="sheet-h">Reimposto la demo?</div><div class="small">Torna tutto come all\'inizio: calendario, conversazioni, campagne e registro.</div><div class="row"><button class="btn ghost" data-a="closeSheet">No</button><button class="btn danger" data-a="sconfirm">Reimposta</button></div>',function(){
    try{localStorage.removeItem(KEY)}catch(e){}S=seed();UI.day=TODAY;UI.calMode='day';UI.cf='all';UI.stats='set';UI.pending=null;$('#aconv').innerHTML='';closeSheet();closePush();UI.tab='cal';render(true);toast('Demo reimpostata')})},
  sug:function(v){if(!UI.agentOpen)openAgent();submit(v)},
  allsug:function(){var h=picks(ALL);addEl(h,'say')},
  goto:function(v){closeAgent();var p=v.split(':');
    if(p[0]==='cal'){UI.day=p[1]||TODAY;UI.calMode='day';go('cal')}
    else if(p[0]==='stats'){UI.stats=p[1]||'set';go('stats')}
    else if(p[0]==='chat'){UI.tab='conv';render(true);openChat(p[1])}
    else go(p[0])},
  nact:function(v){var a=notifActs[+v];hideNotif();if(a)a.fn()},
  wback:function(){var w=UI.wiz;if(w.step>1){w.step--;w.err='';renderPush()}else closePush()},
  wnext:wizNext,
  wlist:function(v){UI.wiz.list=v;UI.wiz.err='';renderPush()},
  wmode:function(v){UI.wiz.mode=v;renderPush()},
  wwhen:function(v){UI.wiz.when=v;renderPush()},
  wgen:function(){var w=UI.wiz;var x=w.ai.trim();if(!x){w.err='Scrivi prima cosa vuoi promuovere.';renderPush();return}
    if(!/\d/.test(x)){w.err='Manca il prezzo: l\'AI non lo inventa. Aggiungilo nella descrizione.';renderPush();return}
    w.err='';w.aiBody='Ciao {{nome}}! '+cap(x.replace(/[.!]+$/,''))+'. Prenota il tuo posto 👇';renderPush()}
};
function profileHTML(){
  var o=S.role==='owner';
  return '<div class="tt" style="justify-content:flex-start;gap:12px"><span class="av" style="width:48px;height:48px;font-size:16px">'+(o?'GI':'LU')+'</span><div><div class="sheet-h">'+(o?'Giulia':'Luca')+'</div><div class="small">'+BIZ+' · '+(o?'Titolare':'Collaboratore')+'</div></div></div>'+
    '<div><div class="sec" style="margin-bottom:6px">Vedi l\'app come</div><div class="seg" style="margin:0"><button class="'+(o?'on':'')+'" data-a="role" data-v="owner">Giulia · titolare</button><button class="'+(o?'':'on')+'" data-a="role" data-v="collab">Luca · collaboratore</button></div></div>'+
    '<div><div class="sec">Notifiche</div>'+[['Template approvati o rifiutati da Meta',1],['Campagne da approvare',1],['L\'AI si ferma in una conversazione',1],['Disdette e spostamenti dei clienti',1],['Riepilogo giornaliero',0]].map(function(x){return '<div class="toggle"><span>'+x[0]+'</span><button class="sw'+(x[1]?' on':'')+'" data-a="sw" aria-label="'+x[0]+'"></button></div>'}).join('')+'</div>'+
    '<div class="toggle"><span>Google Calendar<div class="small">Collegato · sincronizzazione nei due sensi</div></span><span class="chip ok">● attivo</span></div>'+
    '<div class="toggle" style="border:0"><span>Numeri WhatsApp, utenti e integrazioni<div class="small">Si gestiscono dalla piattaforma web di Velto</div></span></div>'+
    '<button class="ver" data-a="vtap">Prototipo · dati finti · v0.1</button><div id="resetbox" hidden><button class="btn danger" data-a="reset">Reimposta demo</button></div>';
}
function openChat(id){var c=convById(id);if(!c)return;c.unread=false;save();UI.wiz=null;UI.chat=id;openPush();render()}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var f=A[t.dataset.a];if(f){e.preventDefault();f(t.dataset.v,t,e)}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='aform'){stopRec();submit($('#ain').value,false)}
  if(e.target.id==='chatform'){var i=$('#chatin'),x=i.value.trim();if(!x)return;var c=convById(UI.chat);addMsg(c.name,{f:'biz',lab:who(),x:x});c.need=null;i.value='';save();renderPush(true);render()}
});
document.addEventListener('input',function(e){
  var k=e.target.dataset&&e.target.dataset.w;
  if(k&&UI.wiz){UI.wiz[k]=e.target.value;if(UI.wiz.step===2&&UI.wiz.mode==='reuse'){var b=wizBody(UI.wiz);$('#wprev').innerHTML=b?waPreview(b,['Prenota ora','Info','Disiscriviti']):'<div class="card small">Compila i campi per vedere l\'anteprima.</div>'}}
  if(e.target.id==='ain')syncSend();
});
document.addEventListener('change',function(e){if(e.target.id==='statsel'){UI.stats=e.target.value;render()}});
function syncSend(){var has=$('#ain').value.trim().length>0;$('#asend').hidden=!has}

/* ---------- voce ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null,listening=false,srBroken=false,pressT=0,justStarted=false,heard='';
var mic=$('#amic'),hint=$('#ahint'),HINT0='Tieni premuto il microfono per parlare, oppure scrivi';
function setMic(on){listening=on;mic.classList.toggle('on',on);hint.textContent=on?'Ti ascolto… lascia il dito o tocca di nuovo per finire':HINT0;$('#ain').placeholder=on?'Ti ascolto…':'Scrivi all\'agente…'}
function tip(x){hint.textContent=x;setTimeout(function(){if(!listening)hint.textContent=HINT0},6000)}
function startRec(){
  try{rec=new SR();rec.lang='it-IT';rec.interimResults=true;rec.continuous=false;heard='';
    rec.onresult=function(ev){var s='';for(var i=0;i<ev.results.length;i++)s+=ev.results[i][0].transcript;heard=s;$('#ain').value=s;syncSend()};
    rec.onerror=function(ev){setMic(false);if(/not-allowed|service-not-allowed|audio-capture/.test(ev.error)){srBroken=true;tip('Qui il microfono non è disponibile. Tocca il campo di testo e usa il microfono della tastiera.')}else if(ev.error==='no-speech')tip('Non ho sentito niente. Riprova o scrivi.')};
    rec.onend=function(){var was=listening;setMic(false);if(was&&heard.trim())submit(heard,true)};
    rec.start();setMic(true);$('#ain').value='';
  }catch(err){srBroken=true;dictation()}
}
function stopRec(){if(rec&&listening){try{rec.stop()}catch(e){}}}
function dictation(){var i=$('#ain');i.focus();tip('Tocca il microfono della tastiera per dettare, poi premi Invia.')}
mic.addEventListener('pointerdown',function(e){if(!SR||srBroken)return;e.preventDefault();if(!listening){startRec();pressT=Date.now();justStarted=true}});
mic.addEventListener('pointerup',function(){if(!SR||srBroken)return;if(listening&&(!justStarted||Date.now()-pressT>500))stopRec();justStarted=false});
mic.addEventListener('click',function(){if(!SR||srBroken)dictation()});
mic.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ---------- avvio ---------- */
S.camps.forEach(function(c){if(c.status==='review')scheduleApproval(c)});
render(true);
setTimeout(function(){var c=campById('bf');if(S.role==='owner'&&!S.bfNotified&&c&&c.status==='approval'){S.bfNotified=true;save();
  notify({title:'Luca ha preparato “Black Friday anticipato”',text:'860 contatti · ≈ '+eur(860*MKT)+' di costi Meta. Vuoi approvarla?',actions:[{l:'Apri',cls:'ghost',fn:function(){go('camp')}},{l:'Approva',cls:'cta',fn:function(){openAgent();submit('Approva Black Friday anticipato')}}]})}},25000);
})();
</script>
